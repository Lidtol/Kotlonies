spring.application.name=kotlonies-api

# Importa el .env de la raíz si existe (ruta relativa a la carpeta desde la que arrancas)
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kotlonies}
spring.datasource.username=${DB_USER:kotlonies_app}
spring.datasource.password=${DB_PASSWORD:}